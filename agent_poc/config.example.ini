[connection]
# Devbox hostname or IP reachable from your laptop.
devbox_host = devbox.example.local
# Port the agent listens on (must match agent's --port).
devbox_port = 8765
# Shared secret. Must match GAZE_TOKEN env var on the devbox.
token = change-me-please

[action]
# Used by demo.py. Click coords are ABSOLUTE devbox screen coords (no
# window-relative math \u2014 the agent runs locally on the devbox).
click_x = 400
click_y = 400
type_text = hello from laptop via agent

[timing]
settle_seconds = 1.0
http_timeout_seconds = 10
