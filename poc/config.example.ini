[connection]
# Substring used to locate the Windows App session window by title.
# Typically the devbox / Dev Box connection name as it appears in Windows App.
window_title_contains = devbox

# Best-effort launch. Leave blank to skip launch (assume session already open).
# Examples:
#   ms-avd:connect?workspaceId=...&resourceid=...
#   msrdcw.exe
launch_uri =

[action]
# Click coordinates RELATIVE to the session window's top-left (pixels).
click_x = 200
click_y = 200

# Text to type after the click.
type_text = hello from laptop

[timing]
# Seconds to wait after focusing the window before acting.
focus_delay = 1.0
# Seconds to wait between click and screenshot (let UI settle over the network).
settle_delay = 1.5

[output]
screenshot_path = poc/out/screenshot.png
