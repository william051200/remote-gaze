# Single config file for ALL scripts in poc/. Copy to config.ini and edit.
# Coordinates are RELATIVE to the Windows App session window's top-left,
# unless noted otherwise.

[connection]
# Substring of the Windows App session window title (case-insensitive).
# Usually the devbox / Dev Box connection name as it appears in Windows App.
window_title_contains = devbox

# Optional: best-effort launch. Leave blank to skip and assume the session
# is already open. Examples:
#   ms-avd:connect?workspaceId=...&resourceid=...
#   msrdcw.exe
launch_uri =

# ----- rdp_click.py -----
[action]
click_x = 200
click_y = 200
type_text = hello from laptop

# ----- open_notepad.py -----
[notepad]
# How to open the remote Start menu:
#   win        - Windows key. ONLY reaches the devbox when Windows App is FULLSCREEN.
#   alt-home   - RDP/Windows App built-in shortcut. Works in windowed mode.
start_method = alt-home

# What to launch from Start.
app_name = notepad

# What to type into Notepad once it's focused. Empty = don't type.
write_text = hello world

# Single mouse click (relative to the session window) to close Notepad.
# Tune to wherever Notepad's X button lands on YOUR session.
# Set either to a negative value to skip the close click.
close_x = 1600
close_y = 200

[timing]
# Seconds. All defaults are conservative for a laggy network.
focus_delay   = 1.0
settle_delay  = 1.5
start_wait    = 0.8
launch_wait   = 2.5
write_wait    = 0.5
close_wait    = 1.0

[output]
screenshot_path         = poc/out/screenshot.png
notepad_screenshot_path = poc/out/notepad_after.png
